<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="width" />
  <title>FilmMax — منصة السينما الفاخرة</title>
  <meta name="description" content="منصة سينمائية متكاملة للأفلام والمسلسلات والريلز والبث المباشر" />
  <meta name="theme-color" content="#07090d" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#e50914',
              gold: '#f5c518',
              dark: '#07090d',
              card: '#0d111a',
            }
          },
          fontFamily: {
            sans: ['Tajawal', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Font: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #07090d;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #07090d;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #e50914;
    }

    /* Glass Effect */
    .glass-card {
      background: rgba(13, 17, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-nav {
      background: rgba(7, 9, 13, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 3D Carousel Stage */
    .perspective-stage {
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .carousel-card {
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
      transform-style: preserve-3d;
    }

    /* No horizontal scroll burst on mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Mobile Responsive Customizations */
    @media (max-width: 640px) {
      .mobile-hero-height {
        height: 38vh;
        min-height: 230px;
        max-height: 320px;
      }
      .mobile-poster {
        width: 46vw;
        max-width: 180px;
      }
    }
    @media (min-width: 641px) {
      .mobile-hero-height {
        height: 380px;
      }
      .mobile-poster {
        width: 220px;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-24 text-gray-100 select-none">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-40 w-full glass-card border-b border-white/5 px-3 sm:px-6 py-2.5 sm:py-3 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="filterCategory('all')">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-[#e50914] to-[#ff3b47] flex items-center justify-center shadow-lg shadow-[#e50914]/30">
          <i data-lucide="film" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-1">
            <span class="text-lg sm:text-xl font-black tracking-tight text-white">FILM<span class="text-[#e50914]">MAX</span></span>
            <span class="text-[9px] bg-[#f5c518] text-black font-black px-1.5 py-0.5 rounded font-mono">VIP</span>
          </div>
          <span class="hidden sm:block text-[10px] text-gray-400">منصة السينما والبث 4K HDR</span>
        </div>
      </div>

      <!-- Live Search Box -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative flex items-center">
          <i data-lucide="search" class="absolute right-3 w-4 h-4 text-gray-400 pointer-events-none"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="ابحث عن فيلم، ممثل، أو تصنيف..."
            class="w-full bg-white/5 border border-white/10 rounded-full pr-9 pl-4 py-1.5 sm:py-2 text-xs sm:text-sm text-white placeholder-gray-400 focus:outline-none focus:border-[#e50914] focus:ring-1 focus:ring-[#e50914] transition-all"
            oninput="handleSearch(this.value)"
          />
        </div>
      </div>

      <!-- Action Badges -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="toggleWatchlistModal()" class="relative p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 hover:text-white transition-all" title="قائمتي">
          <i data-lucide="bookmark" class="w-4 h-4"></i>
          <span id="watchlistBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-[#e50914] text-white text-[10px] font-bold rounded-full items-center justify-center">0</span>
        </button>
        <button onclick="openVipModal()" class="hidden sm:flex items-center gap-1 px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-500/20 to-yellow-500/20 border border-amber-500/30 text-amber-300 text-xs font-bold hover:brightness-110 transition-all">
          <i data-lucide="crown" class="w-3.5 h-3.5"></i>
          <span>عضوية VIP</span>
        </button>
      </div>

    </div>

    <!-- Category Pills -->
    <div class="max-w-7xl mx-auto flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar pt-2.5 sm:pt-3">
      <button onclick="filterCategory('all')" class="cat-btn active whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-[#e50914] text-white shadow-md shadow-[#e50914]/25" data-cat="all">الكل</button>
      <button onclick="filterCategory('movies')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="movies">أفلام</button>
      <button onclick="filterCategory('series')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="series">مسلسلات</button>
      <button onclick="filterCategory('action')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="action">أكشن</button>
      <button onclick="filterCategory('scifi')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="scifi">خيال علمي</button>
      <button onclick="filterCategory('nature')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="nature">وثائقي</button>
      <button onclick="filterCategory('drama')" class="cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10" data-cat="drama">دراما</button>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="w-full max-w-7xl mx-auto px-3 sm:px-6 py-4 space-y-6 sm:space-y-8">

    <!-- 1. 3D PERSPECTIVE CAROUSEL HERO (Optimized for Mobile) -->
    <section id="heroSection" class="relative w-full overflow-hidden rounded-2xl sm:rounded-3xl glass-card border border-white/10 shadow-2xl bg-[#080b11] p-3 sm:p-5">
      
      <!-- Ambient Glow Behind Active Card -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-25 overflow-hidden">
        <div class="w-72 sm:w-96 h-72 sm:h-96 rounded-full bg-[#e50914] blur-[90px]"></div>
      </div>

      <!-- Carousel Top Bar -->
      <div class="relative z-10 flex items-center justify-between mb-2 sm:mb-4 px-1 sm:px-2">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 bg-[#e50914] text-white text-[10px] sm:text-xs font-black px-2.5 py-1 rounded-full shadow-md shadow-[#e50914]/30">
            <i data-lucide="sparkles" class="w-3 h-3"></i>
            <span>3D Cinema Spotlight</span>
          </span>
          <span class="hidden sm:inline text-xs text-gray-400">اسحب للتنقل بين العروض المميزة</span>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="prevHero()" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 hover:text-white transition-all" title="السابق">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
          <button onclick="nextHero()" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 hover:text-white transition-all" title="التالي">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 3D Carousel Stage -->
      <div id="carouselStage" class="relative z-10 w-full mobile-hero-height flex items-center justify-center perspective-stage py-2 overflow-hidden touch-pan-y">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- Hero Active Movie Info & Controls -->
      <div id="heroDetails" class="relative z-10 mt-2 sm:mt-4 text-center px-2">
        <!-- Details injected dynamically -->
      </div>

      <!-- Carousel Dots -->
      <div id="heroDots" class="relative z-10 flex items-center justify-center gap-1.5 mt-3">
        <!-- Dots injected dynamically -->
      </div>
    </section>

    <!-- 2. TRENDING NOW SECTION -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <i data-lucide="flame" class="w-5 h-5 text-[#e50914]"></i>
          <h2 class="text-base sm:text-lg font-bold text-white">الأكثر رواجاً الآن (Trending)</h2>
        </div>
        <span class="text-xs text-gray-400 font-mono">4K Ultra HD</span>
      </div>
      <div id="trendingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 sm:gap-4">
        <!-- Cards injected dynamically -->
      </div>
    </section>

    <!-- 3. TOP RATED CINEMA TRACK -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <i data-lucide="star" class="w-5 h-5 text-[#f5c518]"></i>
          <h2 class="text-base sm:text-lg font-bold text-white">الأعلى تقييماً (Top IMDb)</h2>
        </div>
        <span class="text-xs text-gray-400 font-mono">9.0+ IMDb</span>
      </div>
      <div id="topRatedGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 sm:gap-4">
        <!-- Cards injected dynamically -->
      </div>
    </section>

  </main>

  <!-- ==================== VIDEO PLAYER MODAL ==================== -->
  <div id="videoModal" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-2 sm:p-6 hidden">
    <div class="relative w-full max-w-4xl bg-[#0d111a] border border-white/10 rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col">
      
      <!-- Video Modal Header -->
      <div class="flex items-center justify-between p-3 sm:p-4 border-b border-white/10 bg-[#07090d]">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded bg-[#e50914] text-white text-[10px] font-black">LIVE 4K</span>
          <h3 id="modalVideoTitle" class="text-sm sm:text-base font-bold text-white truncate max-w-xs sm:max-w-md">مشغل الفيلم</h3>
        </div>
        <button onclick="closeVideoModal()" class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 text-gray-300 hover:text-white transition-all">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Video Element Container -->
      <div class="relative w-full aspect-video bg-black flex items-center justify-center">
        <video id="playerVideo" controls playsinline class="w-full h-full object-cover">
          <source id="videoSource" src="" type="video/mp4" />
          متصفحك لا يدعم تشغيل الفيديو.
        </video>
      </div>

      <!-- Modal Info Details -->
      <div class="p-3 sm:p-5 space-y-2 bg-[#0d111a]">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <span id="modalRating" class="flex items-center gap-1 bg-[#f5c518]/20 text-[#f5c518] border border-[#f5c518]/30 px-2 py-0.5 rounded text-xs font-bold">
              <i data-lucide="star" class="w-3.5 h-3.5 fill-[#f5c518]"></i> 9.2
            </span>
            <span id="modalYear" class="text-xs text-gray-400">2024</span>
            <span id="modalDuration" class="text-xs text-gray-400">ساعتان و 15 دقيقة</span>
          </div>
          <button id="modalWatchlistBtn" onclick="toggleModalWatchlist()" class="flex items-center gap-1.5 px-3 py-1 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition-all">
            <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
            <span id="modalWatchlistText">إضافة لقائمتي</span>
          </button>
        </div>
        <p id="modalDescription" class="text-xs sm:text-sm text-gray-300 leading-relaxed">
          وصف الفيلم وتفاصيل القصة والمشاهدة...
        </p>
      </div>

    </div>
  </div>

  <!-- ==================== WATCHLIST MODAL ==================== -->
  <div id="watchlistModal" class="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3 sm:p-6 hidden">
    <div class="relative w-full max-w-2xl bg-[#0d111a] border border-white/10 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <i data-lucide="bookmark-check" class="w-5 h-5 text-[#e50914]"></i>
          <h3 class="text-base font-bold text-white">قائمتي المحفوظة (Watchlist)</h3>
        </div>
        <button onclick="toggleWatchlistModal()" class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="watchlistContent" class="flex-1 overflow-y-auto py-4 space-y-3">
        <!-- Watchlist items rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- ==================== BOTTOM NAVIGATION BAR ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 w-full glass-nav px-2 sm:px-6 py-2 flex items-center justify-around text-gray-400">
    <button onclick="filterCategory('all'); window.scrollTo({top: 0, behavior: 'smooth'});" class="flex flex-col items-center gap-1 text-white text-[11px] font-bold">
      <i data-lucide="home" class="w-5 h-5 text-[#e50914]"></i>
      <span>الرئيسية</span>
    </button>
    <button onclick="filterCategory('movies')" class="flex flex-col items-center gap-1 hover:text-white text-[11px] font-medium transition-all">
      <i data-lucide="film" class="w-5 h-5"></i>
      <span>أفلام</span>
    </button>
    <button onclick="filterCategory('series')" class="flex flex-col items-center gap-1 hover:text-white text-[11px] font-medium transition-all">
      <i data-lucide="tv" class="w-5 h-5"></i>
      <span>مسلسلات</span>
    </button>
    <button onclick="filterCategory('action')" class="flex flex-col items-center gap-1 hover:text-white text-[11px] font-medium transition-all">
      <i data-lucide="flame" class="w-5 h-5"></i>
      <span>الأكشن</span>
    </button>
    <button onclick="toggleWatchlistModal()" class="flex flex-col items-center gap-1 hover:text-white text-[11px] font-medium transition-all">
      <i data-lucide="bookmark" class="w-5 h-5"></i>
      <span>قائمتي</span>
    </button>
  </nav>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->

    let currentHeroIndex = 0;
    let activeMovie = MOVIES[0];
    let watchlist = JSON.parse(localStorage.getItem('filmmax_watchlist') || '[]');
    let touchStartX = 0;

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderHero();
      renderGrids(MOVIES);
      updateWatchlistBadge();
      initTouchEvents();
      
      // Auto rotate carousel every 6s
      setInterval(() => {
        nextHero();
      }, 6000);
    });

    // 3D Hero Render Function
    function renderHero() {
      const stage = document.getElementById('carouselStage');
      const details = document.getElementById('heroDetails');
      const dots = document.getElementById('heroDots');
      const isMobile = window.innerWidth < 640;

      activeMovie = MOVIES[currentHeroIndex];

      // Build 3D cards
      let cardsHtml = '';
      MOVIES.forEach((movie, index) => {
        const offset = (index - currentHeroIndex + MOVIES.length) % MOVIES.length;
        let pos = offset;
        if (pos > MOVIES.length / 2) {
          pos -= MOVIES.length;
        }

        const isCenter = pos === 0;
        let translateX = 0;
        let rotateY = 0;
        let scale = 0.7;
        let opacity = 0.2;
        let zIndex = 10;
        let isGrayscale = true;

        const step1 = isMobile ? 55 : 140;
        const step2 = isMobile ? 100 : 250;

        if (isCenter) {
          translateX = 0;
          rotateY = 0;
          scale = 1.05;
          opacity = 1;
          zIndex = 30;
          isGrayscale = false;
        } else if (pos === -1) {
          translateX = -step1;
          rotateY = isMobile ? 15 : 22;
          scale = isMobile ? 0.85 : 0.82;
          opacity = 0.45;
          zIndex = 20;
        } else if (pos === 1) {
          translateX = step1;
          rotateY = isMobile ? -15 : -22;
          scale = isMobile ? 0.85 : 0.82;
          opacity = 0.45;
          zIndex = 20;
        } else if (pos === -2) {
          translateX = -step2;
          rotateY = isMobile ? 25 : 35;
          scale = 0.7;
          opacity = 0.2;
        } else if (pos === 2) {
          translateX = step2;
          rotateY = isMobile ? -25 : -35;
          scale = 0.7;
          opacity = 0.2;
        } else {
          opacity = 0;
        }

        cardsHtml += `
          <div
            class="carousel-card absolute cursor-pointer"
            style="transform: translate3d(${translateX}px, 0px, 0px) rotateY(${rotateY}deg) scale(${scale}); z-index: ${zIndex}; opacity: ${opacity};"
            onclick="selectHeroMovie(${index})"
          >
            <div class="relative mobile-poster aspect-[2/3] rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl border ${
              isCenter ? 'border-[#e50914] shadow-[#e50914]/35 ring-2 ring-[#e50914]/40' : 'border-white/10'
            } transition-all duration-500">
              <img
                src="${movie.poster}"
                alt="${movie.title}"
                class="w-full h-full object-cover block transition-all duration-500 ${
                  isGrayscale ? 'grayscale contrast-125 brightness-90' : 'grayscale-0'
                }"
              />
              <div class="absolute top-2 left-2 flex items-center gap-1 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-bold text-[#f5c518]">
                <span>${movie.rating}</span>
                <i data-lucide="star" class="w-3 h-3 fill-[#f5c518]"></i>
              </div>
              <div class="absolute top-2 right-2 bg-[#e50914] text-white text-[9px] font-black px-1.5 py-0.5 rounded">
                4K HDR
              </div>
            </div>
          </div>
        `;
      });
      stage.innerHTML = cardsHtml;

      // Build Details
      const isSaved = watchlist.some(m => m.id === activeMovie.id);
      details.innerHTML = `
        <h1 class="text-base sm:text-xl font-black text-white mb-1.5 tracking-tight">${activeMovie.title}</h1>
        <div class="flex items-center justify-center gap-2 text-xs text-gray-400 mb-3 flex-wrap">
          <span class="text-[#f5c518] font-bold flex items-center gap-1">
            <i data-lucide="star" class="w-3.5 h-3.5 fill-[#f5c518]"></i> ${activeMovie.rating} IMDb
          </span>
          <span>•</span>
          <span>${activeMovie.type}</span>
          <span>•</span>
          <span>${activeMovie.year}</span>
          <span>•</span>
          <span>${activeMovie.duration}</span>
        </div>
        <div class="flex items-center justify-center gap-2">
          <button onclick="playMovie(${activeMovie.id})" class="flex items-center gap-2 bg-[#e50914] hover:bg-[#ff1f2d] text-white px-5 sm:px-7 py-2 sm:py-2.5 rounded-xl font-black text-xs sm:text-sm shadow-lg shadow-[#e50914]/30 hover:scale-105 active:scale-95 transition-all">
            <i data-lucide="play" class="w-4 h-4 fill-white"></i>
            <span>مشاهدة العرض الآن</span>
          </button>
          <button onclick="toggleWatchlist(${activeMovie.id})" class="p-2 sm:p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-all" title="حفظ في قائمتي">
            <i data-lucide="${isSaved ? 'bookmark-check' : 'bookmark'}" class="w-4 h-4 ${isSaved ? 'text-[#e50914]' : ''}"></i>
          </button>
        </div>
      `;

      // Build Dots
      let dotsHtml = '';
      MOVIES.forEach((_, idx) => {
        dotsHtml += `
          <button
            onclick="selectHeroMovie(${idx})"
            class="h-1.5 rounded-full transition-all duration-300 ${
              idx === currentHeroIndex ? 'w-6 bg-[#e50914]' : 'w-1.5 bg-white/20 hover:bg-white/40'
            }"
          ></button>
        `;
      });
      dots.innerHTML = dotsHtml;

      lucide.createIcons();
    }

    function nextHero() {
      currentHeroIndex = (currentHeroIndex + 1) % MOVIES.length;
      renderHero();
    }

    function prevHero() {
      currentHeroIndex = (currentHeroIndex - 1 + MOVIES.length) % MOVIES.length;
      renderHero();
    }

    function selectHeroMovie(index) {
      if (currentHeroIndex === index) {
        playMovie(MOVIES[index].id);
      } else {
        currentHeroIndex = index;
        renderHero();
      }
    }

    // Touch Swipes on Hero Stage
    function initTouchEvents() {
      const stage = document.getElementById('carouselStage');
      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff > 0) {
            prevHero(); // Swiped right
          } else {
            nextHero(); // Swiped left
          }
        }
      }, { passive: true });
    }

    // Render Movie Grids
    function renderGrids(list) {
      const trendingGrid = document.getElementById('trendingGrid');
      const topRatedGrid = document.getElementById('topRatedGrid');

      const cardRenderer = (movie) => {
        const isSaved = watchlist.some(m => m.id === movie.id);
        return `
          <div class="group relative rounded-xl overflow-hidden glass-card border border-white/10 hover:border-[#e50914]/50 transition-all duration-300 flex flex-col">
            <div class="relative w-full aspect-[2/3] overflow-hidden cursor-pointer" onclick="playMovie(${movie.id})">
              <img src="${movie.poster}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <div class="w-10 h-10 rounded-full bg-[#e50914] flex items-center justify-center text-white shadow-lg">
                  <i data-lucide="play" class="w-5 h-5 fill-white"></i>
                </div>
              </div>
              <div class="absolute top-2 right-2 bg-[#e50914] text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow">
                4K
              </div>
              <div class="absolute top-2 left-2 bg-black/70 backdrop-blur-md text-[#f5c518] text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5">
                <i data-lucide="star" class="w-3 h-3 fill-[#f5c518]"></i>
                ${movie.rating}
              </div>
            </div>
            <div class="p-2 sm:p-3 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="text-xs sm:text-sm font-bold text-white truncate cursor-pointer" onclick="playMovie(${movie.id})">${movie.title}</h3>
                <div class="flex items-center justify-between text-[10px] text-gray-400 mt-1">
                  <span>${movie.type}</span>
                  <span>${movie.year}</span>
                </div>
              </div>
              <div class="flex items-center justify-between mt-2 pt-2 border-t border-white/5">
                <button onclick="playMovie(${movie.id})" class="text-[11px] text-[#e50914] font-bold hover:underline flex items-center gap-1">
                  مشاهدة
                </button>
                <button onclick="toggleWatchlist(${movie.id})" class="text-gray-400 hover:text-white p-1" title="حفظ">
                  <i data-lucide="${isSaved ? 'bookmark-check' : 'bookmark'}" class="w-3.5 h-3.5 ${isSaved ? 'text-[#e50914]' : ''}"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      };

      if (trendingGrid) {
        trendingGrid.innerHTML = list.map(cardRenderer).join('');
      }
      if (topRatedGrid) {
        const top = [...list].sort((a, b) => b.rating - a.rating);
        topRatedGrid.innerHTML = top.map(cardRenderer).join('');
      }

      lucide.createIcons();
    }

    // Filter Categories
    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn active whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-[#e50914] text-white shadow-md shadow-[#e50914]/25';
        } else {
          btn.className = 'cat-btn whitespace-nowrap px-3.5 py-1 rounded-full text-xs font-bold transition-all bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10';
        }
      });

      if (cat === 'all') {
        renderGrids(MOVIES);
      } else {
        const filtered = MOVIES.filter(m => m.category === cat || m.type.includes(cat));
        renderGrids(filtered.length > 0 ? filtered : MOVIES);
      }
    }

    // Search
    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderGrids(MOVIES);
        return;
      }
      const results = MOVIES.filter(m => 
        m.title.toLowerCase().includes(q) ||
        m.type.toLowerCase().includes(q) ||
        m.description.toLowerCase().includes(q)
      );
      renderGrids(results);
    }

    // Video Player Modal
    function playMovie(id) {
      const movie = MOVIES.find(m => m.id === id);
      if (!movie) return;

      activeMovie = movie;
      document.getElementById('modalVideoTitle').innerText = movie.title;
      document.getElementById('modalRating').innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5 fill-[#f5c518]"></i> ${movie.rating} IMDb`;
      document.getElementById('modalYear').innerText = movie.year;
      document.getElementById('modalDuration').innerText = movie.duration;
      document.getElementById('modalDescription').innerText = movie.description;

      const video = document.getElementById('playerVideo');
      const source = document.getElementById('videoSource');
      source.src = movie.videoUrl;
      video.load();
      video.play().catch(() => {});

      updateModalWatchlistButton();
      document.getElementById('videoModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeVideoModal() {
      const video = document.getElementById('playerVideo');
      video.pause();
      document.getElementById('videoModal').classList.add('hidden');
    }

    // Watchlist Management
    function toggleWatchlist(id) {
      const movie = MOVIES.find(m => m.id === id);
      if (!movie) return;

      const index = watchlist.findIndex(m => m.id === id);
      if (index > -1) {
        watchlist.splice(index, 1);
      } else {
        watchlist.push(movie);
      }

      localStorage.setItem('filmmax_watchlist', JSON.stringify(watchlist));
      updateWatchlistBadge();
      renderHero();
      renderGrids(MOVIES);
      renderWatchlistModalContent();
    }

    function toggleModalWatchlist() {
      if (activeMovie) {
        toggleWatchlist(activeMovie.id);
        updateModalWatchlistButton();
      }
    }

    function updateModalWatchlistButton() {
      const isSaved = watchlist.some(m => m.id === activeMovie.id);
      document.getElementById('modalWatchlistText').innerText = isSaved ? 'في قائمتك المحفوظة' : 'إضافة لقائمتي';
      document.getElementById('modalWatchlistBtn').className = `flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold transition-all ${
        isSaved ? 'bg-[#e50914] text-white' : 'bg-white/10 hover:bg-white/20 text-gray-200'
      }`;
    }

    function updateWatchlistBadge() {
      const badge = document.getElementById('watchlistBadge');
      if (watchlist.length > 0) {
        badge.innerText = watchlist.length;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
      } else {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      }
    }

    function toggleWatchlistModal() {
      const modal = document.getElementById('watchlistModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        renderWatchlistModalContent();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderWatchlistModalContent() {
      const container = document.getElementById('watchlistContent');
      if (watchlist.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-gray-400">
            <i data-lucide="bookmark" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
            <p class="text-sm">قائمتك فارغة حالياً. اضغط على أيقونة الإشارة المرجعية لحفظ أفلامك المفضلة!</p>
          </div>
        `;
      } else {
        container.innerHTML = watchlist.map(movie => `
          <div class="flex items-center justify-between p-2 rounded-xl bg-white/5 border border-white/5">
            <div class="flex items-center gap-3 cursor-pointer" onclick="closeWatchlistAndPlay(${movie.id})">
              <img src="${movie.poster}" class="w-12 h-16 rounded-lg object-cover" />
              <div>
                <h4 class="text-xs sm:text-sm font-bold text-white">${movie.title}</h4>
                <span class="text-[10px] text-gray-400">${movie.type} • ${movie.year}</span>
              </div>
            </div>
            <button onclick="toggleWatchlist(${movie.id})" class="p-2 text-red-400 hover:text-red-300" title="إزالة">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    function closeWatchlistAndPlay(id) {
      toggleWatchlistModal();
      playMovie(id);
    }

    function openVipModal() {
      alert('مرحباً بك! عضوية FilmMax VIP تمنحك وصولاً غير محدود لجميع عروض 4K HDR وصوت Dolby Atmos.');
    }
  </script>
</body>
</html>
